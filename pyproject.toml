[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klin"
version = "0.1.0"
description = "Asset acquisition, generation and provenance for game projects, with a machine-enforced licence gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Costa" }]
keywords = ["assets", "provenance", "licence", "gamedev", "comfyui", "civitai", "huggingface"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
# keyring reaches the operating system's credential store: Credential Manager on
# Windows, Keychain on macOS, Secret Service on Linux. On Windows its only
# dependency is pywin32-ctypes, which is pure Python, so `uv tool install klin`
# still needs no compiler on any platform.
dependencies = ["pyyaml>=6", "keyring>=25"]

[project.optional-dependencies]
# Reserved for reading a KeePass database directly. pykeepass pulls argon2-cffi,
# pycryptodomex and lxml, so it stays out of the base install by design.
keepass = ["pykeepass>=4.1"]

[project.urls]
Homepage = "https://github.com/ostin-pil/klin"

[project.scripts]
klin = "klin.cli:main"

[tool.setuptools]
packages = ["klin", "klin.fetch", "klin.index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
