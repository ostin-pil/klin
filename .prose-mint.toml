# Scope and rules for klin's own prose gate.
#
# Scope is the user-facing docs plus the plugin's skill and command, since those
# are read by Claude in a consuming project and carry the same voice.
# Deliberately out of scope: tests, the manifests (structured config with prose
# around it), and session logs, which are working notes.
#
# hard-wrap is intentionally not enabled: these docs wrap at ~80 columns by
# choice. The gate targets the structural rhetoric tells.
#
# A PR body is scanned with the built-in ruleset instead, which *does* enable
# hard-wrap, so a body wrapped the way these files are wrapped fails a gate
# these files pass. That asymmetry is deliberate and it is not a bug in either
# half: GitHub renders a single newline as a line break, so 80-column wrapping
# that reads well here renders ragged there. Write PR bodies unwrapped and let
# the renderer do it. Noted here because this is the file you open when the
# prose gate goes red, and the reason lives in .github/workflows/prose.yml.

[scope]
include = [
  "README.md",
  "plugin/skills/klin-ledger/SKILL.md",
  "plugin/commands/klin-audit.md",
]

[structural]
enabled = [
  "em-dash",
  "ascii-arrow",
  "not-X-but-Y",
  "no-X-no-Y-just-Z",
  "this-isnt-about-X",
  "not-only-but",
  "bold-colon-opener",
  "ai-attribution",
]
